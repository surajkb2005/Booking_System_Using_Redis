<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedisFly | Ultra-Fast Booking</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="blob"></div>
    <div class="blob2"></div>

    <div class="glass-wrapper">
        <header>
            <div class="logo">✈️ RedisFly</div>
            <p>Concurrency-Safe Flight Engine</p>
        </header>

        <main class="dashboard-grid">
            <section class="card">
                <div class="card-header">
                    <h2>Fleet Manager</h2>
                </div>
                <div class="input-stack">
                    <div class="row">
                        <!-- <input id="fid" placeholder="Flight ID (e.g. 101)"> -->
                        <select id="fid">
                            <option value="AIR1001">AIR1001</option>
                            <option value="AIR201">AIR201</option>
                        </select>
                    </div>
                    <div class="row">
                        <!-- <input id="forig" placeholder="Destination"> -->
                        <select id="forig">
                            <option value="" disabled selected>Select Origin</option>
                            <option value="GO">Goa</option>
                            <option value="BENG">Bengaluru</option>
                        </select>
                        <!-- <input id="fdest" placeholder="Origin"> -->
                        <select id="fdest">
                            <option value="" disabled selected>Select Destination</option>
                            <option value="ND">New Delhi</option>
                            <option value="MUMb">Mumbai</option>
                        </select>
                    </div>
                </div>
                <button class="btn-primary" onclick="addFlight()">Search</button>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Route</th>
                                <th>Fare</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="flight-table"></tbody>
                    </table>
                </div>
            </section>

            <!-- <section class="card">
                <div class="card-header">
                    <h2> Quick Reserve</h2>
                </div>
                <div class="booking-form">
                    <input id="username" placeholder=" Your Name" class="full-width">
                    <input id="seatId" placeholder=" Seat (e.g. A1)" class="full-width">

                    <button id="bookBtn" class="btn-glow" onclick="holdSeat()">Book Now</button>
                    <div id="status-box"></div>
                </div>
            </section> -->
            <section>
                <div class="booking-form">
                    <input id="username" placeholder=" Your Name " class="full-width">

                    <div id="seat-map" class="seat-map"></div>

                    <div id="status-box"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
